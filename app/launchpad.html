<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HotelHub</title>
    <script>
      window["sap-ushell-config"] = {
        defaultRenderer: "fiori2",
        applications: {
          "Bookings-display": {
            title: "Bookings",
            description: "Bron boshqaruvi",
            additionalInformation: "SAPUI5.Component=hotelhub.bookings",
            applicationType: "URL",
            url: "./hotel-booking/webapp",
          },
          "Hotels-manage": {
            title: "Hotels",
            description: "Mehmonxonalar va xonalar",
            additionalInformation: "SAPUI5.Component=hotelhub.hotels",
            applicationType: "URL",
            url: "./hotels/webapp",
          },
        },
      };
    </script>
    <script src="https://ui5.sap.com/test-resources/sap/ushell/bootstrap/sandbox.js"></script>
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/resources/sap-ui-core.js"
      data-sap-ui-libs="sap.m, sap.ushell, sap.fe.templates"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-compatVersion="edge"
      data-sap-ui-async="true"
      data-sap-ui-frameOptions="allow"
    ></script>
    <script>
      sap.ui.getCore().attachInit(function () {
        sap.ushell.Container.createRendererInternal("fiori2").then(
          function (r) {
            r.placeAt("content");
          },
        );
      });
    </script>
  </head>
  <body class="sapUiBody" id="content"></body>
</html>
